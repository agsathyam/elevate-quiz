<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevate Technical Certification Practice Exam</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #dadce0;
      --success: #1e8e3e;
      --danger: #d93025;
      --warning: #f9ab00;
      --flagged: #e37400;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 60px; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px rgba(60,64,67,0.1);
    }
    .header-title h1 { font-size: 1.25rem; font-weight: 600; color: #1f1f1f; }
    .header-title p { font-size: 0.85rem; color: var(--text-secondary); }
    .header-stats { display: flex; gap: 16px; align-items: center; font-size: 0.9rem; font-weight: 500; }
    .stat-badge { padding: 4px 10px; border-radius: 12px; background: #e8f0fe; color: var(--primary); }

    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    @media (max-width: 860px) { .container { grid-template-columns: 1fr; } }

    /* Sidebar / Grid */
    .sidebar { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; height: fit-content; }
    .sidebar h2 { font-size: 1rem; margin-bottom: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .module-select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; background: #fff; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; max-height: 400px; overflow-y: auto; padding-right: 4px; }
    .grid-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .grid-btn:hover { border-color: var(--primary); background: #f1f3f4; }
    .grid-btn.current { border: 2px solid var(--primary); font-weight: 700; }
    .grid-btn.answered { background: #e8f0fe; color: var(--primary); border-color: #aecbfa; }
    .grid-btn.flagged::after {
      content: "🚩";
      font-size: 8px;
      position: absolute;
      top: 2px;
      right: 2px;
    }
    .grid-btn.flagged { border-color: var(--flagged); }
    .grid-btn.correct-eval { background: #e6f4ea !important; color: var(--success) !important; border-color: #ceead6 !important; }
    .grid-btn.wrong-eval { background: #fce8e6 !important; color: var(--danger) !important; border-color: #fad2cf !important; }

    .legend { font-size: 0.8rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }

    /* Main Quiz View */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 1px 2px rgba(60,64,67,0.05); }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .q-badge { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #e8eaed; padding: 4px 8px; border-radius: 4px; color: #3c4043; }
    .flag-btn { background: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
    .flag-btn.active { background: #fef7e0; border-color: var(--warning); color: #b06000; font-weight: 600; }
    .q-text { font-size: 1.05rem; font-weight: 500; margin-bottom: 20px; line-height: 1.6; }

    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .option {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    .option:hover { background: #f8f9fa; border-color: #bdc1c6; }
    .option.selected { background: #e8f0fe; border-color: var(--primary); }
    .option-letter { font-weight: 700; width: 22px; flex-shrink: 0; }
    .option-text { font-size: 0.95rem; }

    .nav-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
    .btn { padding: 9px 18px; border-radius: 6px; font-weight: 500; font-size: 0.9rem; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-secondary { background: #f1f3f4; color: var(--text); }
    .btn-secondary:hover { background: #e8eaed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-submit { background: var(--success); color: #fff; }
    .btn-submit:hover { background: #137333; }

    /* Results Screen */
    .results-card { display: none; }
    .score-summary { text-align: center; padding: 24px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .score-big { font-size: 3rem; font-weight: 800; color: var(--primary); }
    .score-status { font-size: 1.1rem; font-weight: 600; margin-top: 8px; }
    .pass { color: var(--success); }
    .fail { color: var(--danger); }
    .module-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .mod-box { background: #f8f9fa; border: 1px solid var(--border); border-radius: 6px; padding: 12px; text-align: center; }
    .mod-box h4 { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
    .mod-box p { font-size: 1.15rem; font-weight: 700; }

    /* Explanation Accordion / Drawer */
    .review-item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; padding: 16px; background: #fff; }
    .review-item.is-correct { border-left: 6px solid var(--success); }
    .review-item.is-wrong { border-left: 6px solid var(--danger); }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .review-status { font-weight: 700; font-size: 0.85rem; }
    .explanation-box { background: #f8f9fa; border-radius: 6px; padding: 14px; margin-top: 14px; font-size: 0.9rem; line-height: 1.6; }
    .explanation-box p { margin-bottom: 8px; }
    .explanation-box p:last-child { margin-bottom: 0; }
    .exp-title { font-weight: 700; color: #202124; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Elevate Technical Assessment — Practice Simulator</h1>
      <p>54 Exam-Grade Practice Questions (Passing Bar: 90%)</p>
    </div>
    <div class="header-stats">
      <span>Answered: <strong id="answered-count">0</strong> / 54</span>
      <span class="stat-badge" id="flagged-count">0 Flagged</span>
      <button class="btn btn-submit" id="btn-top-submit" onclick="submitExam()">Finish & Score</button>
    </div>
  </header>

  <div class="container">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <h2>Question Navigator</h2>
      <select id="module-filter" class="module-select" onchange="filterByModule()">
        <option value="all">All Modules (54 Questions)</option>
        <option value="Module 0">Module 0: Foundations & ADK (16)</option>
        <option value="Module 1">Module 1: Skills, Context & MCP (9)</option>
        <option value="Module 2">Module 2: AI Threat Defense & Gov (9)</option>
        <option value="Module 3">Module 3: ADK 2.0, Eval, Harness & FinOps (20)</option>
      </select>

      <div class="grid" id="question-grid"></div>

      <div class="legend">
        <div class="legend-item"><div class="legend-box" style="background:#fff;"></div> Unanswered</div>
        <div class="legend-item"><div class="legend-box" style="background:#e8f0fe; border-color:#aecbfa;"></div> Answered</div>
        <div class="legend-item"><div class="legend-box" style="border-color:var(--flagged);"></div> Marked for Review (🚩)</div>
      </div>
    </div>

    <!-- Active Question View -->
    <div class="card" id="quiz-card">
      <div class="q-meta">
        <span class="q-badge" id="q-module-badge">Module 0</span>
        <button class="flag-btn" id="q-flag-btn" onclick="toggleFlag()">
          <span>🚩</span> <span id="flag-text">Mark for Review</span>
        </button>
      </div>

      <h3 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 6px;" id="q-id-topic"></h3>
      <div class="q-text" id="q-text"></div>

      <div class="options" id="options-container"></div>

      <div class="nav-actions">
        <button class="btn btn-secondary" id="btn-prev" onclick="prevQuestion()">Previous</button>
        <div style="font-size: 0.9rem; color: var(--text-secondary);" id="q-position-indicator">Question 1 of 54</div>
        <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">Next</button>
      </div>
    </div>

    <!-- Results View -->
    <div class="card results-card" id="results-card">
      <div class="score-summary">
        <div class="score-big" id="score-percentage">0%</div>
        <div class="score-status" id="score-status">Score: 0 / 54</div>
        <p id="score-pass-msg" style="margin-top: 8px; font-weight: 500;"></p>
        <div style="margin-top: 16px;">
          <button class="btn btn-primary" onclick="restartExam()">Retake Exam</button>
          <button class="btn btn-secondary" onclick="filterReview('incorrect')">Show Incorrect Only</button>
          <button class="btn btn-secondary" onclick="filterReview('all')">Show All Solutions</button>
        </div>
      </div>

      <h3 style="margin-bottom: 14px;">Module Breakdown</h3>
      <div class="module-breakdown" id="module-breakdown"></div>

      <h3 style="margin-bottom: 14px;">Detailed Solution & Explanations</h3>
      <div id="review-list"></div>
    </div>
  </div>

  <script>
    const examQuestions = [
      // MODULE 0
      {
        id: "[M0-01]",
        module: "Module 0",
        topic: "M0L2 • Start with Scoping — WAF Scoping & Business KPI Mapping (Core)",
        question: "A global retail bank asks you to architect a multi-agent customer support platform to 'transform service quality with Generative AI.' Before selecting foundation models, designing system prompts, or configuring automated evaluation pipelines, what must be established as the foundational step?",

          C: "Provision a hybrid vector index in Agent Platform Vector Search over the bank's support runbooks to measure baseline Recall@10 and Mean Reciprocal Rank (MRR) before writing agent.",
          D: "Configure an automated LLM-as-a-Judge pipeline using Agent Platform Gen AI Evaluation Service with a baseline fluency, politeness, and groundedness prompt template over 500 synthetic queries."

        trap: "Never start with model benchmarking or vague rubric terms like 'sound professional'—rubrics require strong operational definitions tied to a Business KPI.",
        theory: "Top-Down Scoping Funnel: 1) Identify and quantify a concrete Business KPI (e.g., reduce MTTR by 30%), 2) Translate it into measurable AI goals and evaluation rubrics with strict operational definitions, and 3) Benchmark against a curated Golden Dataset before iterating on models or prompts."
      },
      {
        id: "[M0-02]",
        module: "Module 0",
        topic: "M0L3 • Intro to ADK & AI Design Patterns — When to Use Agents vs Deterministic Workflows (Core)",
        question: "You are reviewing four enterprise workload proposals during an architecture board review. Which workload represents the strongest architectural fit for an autonomous multi-step ADK agent rather than a deterministic workflow, standard RAG pipeline, or classical ML model?",

        trap: "Adding an agent loop to a fixed workflow introduces unnecessary latency, token cost, and non-determinism.",
        theory: "Deploy autonomous agents only when multi-step control flow depends dynamically on runtime tool observations. For fixed, predictable workflows, deterministic pipelines, standard RAG, or classical ML classifiers provide superior latency, lower token cost, and strict predictability."
      },
      {
        id: "[M0-03]",
        module: "Module 0",
        topic: "M0L3 • Intro to ADK & AI Design Patterns — google-agents-cli Lifecycle (Core)",
        question: "When standardizing enterprise agent development across engineering teams using google-agents-cli, what is the primary architectural role of this command-line toolchain across the software delivery lifecycle?",
        options: {

        trap: "Do not confuse google-agents-cli / adk (customer-ready ADK tooling) with jetski (internal Google CE tool).",
        theory: "google-agents-cli (M0L3 Slide 63) unifies the 8-stage agent engineering lifecycle (Spec -> Scaffold -> Build -> Orchestrate -> Evaluate -> Deploy -> Publish -> Observe) into a single CLI toolchain.",
        note: "On M0L3 Slide 63, the 8 google-agents-cli stages are Spec -> Scaffold -> Build -> Orchestrate -> Evaluate -> Deploy -> Publish -> Observe (Publish is stage 7, not Secure)."
      },
      {
        id: "[M0-04]",
        module: "Module 0",
        topic: "M0L4 • Coding Agent (Antigravity 2.0) — Antigravity Customizations: Rules vs Workflows vs Skills (Core)",
        question: "When configuring an agentic coding environment for an engineering organization, developers can define Rules, Workflows, and Skills. How should an architect partition responsibilities across these three customization primitives?",
        options: {
          A: "Rules (AGENTS.md) enforce always-on global constraints and coding invariants; Workflows (/slash commands) define repeatable user-triggered multi-step procedures; Skills (SKILL.md folders) package domain capabilities loaded dynamically on demand.",

        note: "On M0L3 Slide 53, Level 1 progressive disclosure (name + description frontmatter) is cited at ~60 tokens per skill (and ~100 tokens in go/authoring-agent-skills)."

      {

          C: "Phase A is graded by measuring your typing speed in words per minute, while Phase B only checks whether a blank Cloud Run container returns HTTP 200 OK on /healthz via an asynchronous Cloud Run worker pool configured with VPC Service Controls, Workload Identity Federation, and JSON schema validation inside a managed execution environment.",
          D: "Phase A requires training a 7B-parameter foundation model from scratch on TPUs, while Phase B consists of a 10-question true/false quiz on basic Python syntax inside a managed execution environment backed by Cloud KMS encryption keys, OpenTelemetry span exporters, and automated CI/CD gates with deterministic schema validation, token-level."
        },
        answer: "A",
        why: "Phase A assesses scoping, discovery, and architecture interactively with an AI Evaluator Agent; Phase B validates the actual deployed functional agent against an Automated Evaluation Server.",
        trap: "Passed components are banked permanently; in retakes, you only retake unpassed parts.",
        theory: "Evaluation pipelines combine interactive conversational evaluation (Phase A) with deterministic automated trajectory testing (Phase B)."
      },
      {
        id: "[M3-20]",
        module: "Module 3",
        topic: "Spec-Driven Development with AGENTS.md & verify.py — Harness Engineering in Build (Core)",
        question: "When executing a timed hands-on agentic build challenge evaluated by an Automated Evaluation Server (which tests specific endpoint paths, Agent(name=...) identifiers, tool schemas, callback guardrails, and GCS validation outputs), what is the highest-leverage Harness Engineering workflow to prevent your coding agent from drifting off-spec?",
        options: {
          A: "Paste the entire raw lab page into a single chat message with temperature=1.0 and deploy whatever code the assistant generates on the first turn without running local verification via an asynchronous Cloud Run worker pool configured with VPC Service Controls, Workload Identity Federation, and JSON schema validation.",
          B: "Extract the exact grading contract (required agent names, tool signatures/docstrings, callback rules, ports, and GCS output paths) into a persistent AGENTS.md / SPEC.md file in the workspace root, and build a local verify.py test script that your coding agent must execute and pass before every deployment.",
          C: "Disable all local Python linting and type-checking tools so the coding agent can write untyped functions faster without stopping to inspect error tracebacks inside a managed execution environment backed by Cloud KMS encryption keys, OpenTelemetry span exporters, and automated CI/CD gates.",
          D: "Instruct the coding agent to generate five separate microservices in different programming languages and deploy all of them simultaneously to the same Cloud Run service URL with deterministic schema validation, token-level rate limiting, and per-tenant IAM role bindings enforced at the service boundary."
        },
        answer: "B",
        why: "Combining Context Engineering (read files first, run verify.py) with Harness Engineering (AGENTS.md + verify.py test script) ensures your coding agent self-verifies against the grading spec before declaring completion.",
        trap: "Locking exact grading names/ports into AGENTS.md + verify.py prevents 99% of grading mismatches!",
        theory: "Agent = Model + Harness: explicit specifications (AGENTS.md) and automated local test runners (verify.py) eliminate architectural and specification drift."
      }
    ];

    let currentIndex = 0;
    let userAnswers = {};
    let flaggedQuestions = new Set();
    let currentFilteredList = [...examQuestions];

    function initApp() {
      buildGrid();
      loadQuestion(0);
      updateStats();
    }

    function buildGrid() {
      const grid = document.getElementById("question-grid");
      grid.innerHTML = "";
      currentFilteredList.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.title = `${q.id} ${q.topic}`;
        btn.onclick = () => loadQuestion(idx);
        grid.appendChild(btn);
      });
      syncGridState();
    }

    function syncGridState() {
      currentFilteredList.forEach((q, idx) => {
        const btn = document.getElementById(`grid-btn-${idx}`);
        if (!btn) return;

        btn.classList.toggle("current", idx === currentIndex);
        btn.classList.toggle("answered", userAnswers[q.id] !== undefined);
        btn.classList.toggle("flagged", flaggedQuestions.has(q.id));
      });
    }

    function loadQuestion(index) {
      if (index < 0 || index >= currentFilteredList.length) return;
      currentIndex = index;
      const q = currentFilteredList[currentIndex];

      document.getElementById("q-module-badge").innerText = q.module;
      document.getElementById("q-id-topic").innerText = `${q.id} • ${q.topic}`;
      document.getElementById("q-text").innerText = q.question;
      document.getElementById("q-position-indicator").innerText = `Question ${currentIndex + 1} of ${currentFilteredList.length}`;

      // Flag state
      const isFlagged = flaggedQuestions.has(q.id);
      const flagBtn = document.getElementById("q-flag-btn");
      flagBtn.classList.toggle("active", isFlagged);
      document.getElementById("flag-text").innerText = isFlagged ? "Flagged for Review" : "Mark for Review";

      // Options
      const container = document.getElementById("options-container");
      container.innerHTML = "";

      Object.entries(q.options).forEach(([letter, text]) => {
        const opt = document.createElement("div");
        opt.className = "option";
        if (userAnswers[q.id] === letter) opt.classList.add("selected");

        opt.innerHTML = `
          <div class="option-letter">${letter}.</div>
          <div class="option-text">${text}</div>
        `;

        opt.onclick = () => selectOption(q.id, letter);
        container.appendChild(opt);
      });

      // Nav buttons
      document.getElementById("btn-prev").disabled = currentIndex === 0;
      document.getElementById("btn-next").innerText = currentIndex === currentFilteredList.length - 1 ? "Review / Submit" : "Next";

      syncGridState();
    }

    function selectOption(qId, letter) {
      userAnswers[qId] = letter;
      loadQuestion(currentIndex);
      updateStats();
    }

    function toggleFlag() {
      const q = currentFilteredList[currentIndex];
      if (flaggedQuestions.has(q.id)) {
        flaggedQuestions.delete(q.id);
      } else {
        flaggedQuestions.add(q.id);
      }
      loadQuestion(currentIndex);
      updateStats();
    }

    function prevQuestion() {
      if (currentIndex > 0) loadQuestion(currentIndex - 1);
    }

    function nextQuestion() {
      if (currentIndex < currentFilteredList.length - 1) {
        loadQuestion(currentIndex + 1);
      } else {
        if (confirm("You have reached the end of the question set. Would you like to submit and score your exam?")) {
          submitExam();
        }
      }
    }

    function updateStats() {
      const answeredTotal = Object.keys(userAnswers).length;
      document.getElementById("answered-count").innerText = answeredTotal;
      document.getElementById("flagged-count").innerText = `${flaggedQuestions.size} Flagged`;
    }

    function filterByModule() {
      const selected = document.getElementById("module-filter").value;
      if (selected === "all") {
        currentFilteredList = [...examQuestions];
      } else {
        currentFilteredList = examQuestions.filter(q => q.module === selected);
      }
      buildGrid();
      loadQuestion(0);
    }

    function submitExam() {
      const totalQuestions = examQuestions.length;
      const answeredTotal = Object.keys(userAnswers).length;

      if (answeredTotal < totalQuestions) {
        const proceed = confirm(`You have answered ${answeredTotal} out of ${totalQuestions} questions. Are you sure you want to finish and view your final score?`);
        if (!proceed) return;
      }

      // Hide quiz view, show results
      document.getElementById("quiz-card").style.display = "none";
      const resultsCard = document.getElementById("results-card");
      resultsCard.style.display = "block";

      let score = 0;
      let moduleScores = {
        "Module 0": { correct: 0, total: 0 },
        "Module 1": { correct: 0, total: 0 },
        "Module 2": { correct: 0, total: 0 },
        "Module 3": { correct: 0, total: 0 }
      };

      examQuestions.forEach(q => {
        const isCorrect = userAnswers[q.id] === q.answer;
        if (isCorrect) score++;

        if (!moduleScores[q.module]) moduleScores[q.module] = { correct: 0, total: 0 };
        moduleScores[q.module].total++;
        if (isCorrect) moduleScores[q.module].correct++;
      });

      const pct = Math.round((score / totalQuestions) * 100);
      document.getElementById("score-percentage").innerText = `${pct}%`;
      document.getElementById("score-status").innerText = `Total Score: ${score} / ${totalQuestions}`;

      const passMsg = document.getElementById("score-pass-msg");
      if (pct >= 90) {
        passMsg.innerHTML = `<span class="pass">🎉 PASS — Target met (>= 90%)! Outstanding performance!</span>`;
      } else {
        passMsg.innerHTML = `<span class="fail">⚠️ BELOW 90% PASSING THRESHOLD — Target requires 90% (Missing ${Math.ceil(totalQuestions * 0.9) - score} more correct answers). Review your mistakes below.</span>`;
      }

      // Populate module breakdown
      const modContainer = document.getElementById("module-breakdown");
      modContainer.innerHTML = "";
      Object.entries(moduleScores).forEach(([modName, stats]) => {
        const modPct = Math.round((stats.correct / stats.total) * 100);
        const div = document.createElement("div");
        div.className = "mod-box";
        div.innerHTML = `
          <h4>${modName}</h4>
          <p style="color: ${modPct >= 90 ? 'var(--success)' : (modPct >= 75 ? 'var(--warning)' : 'var(--danger)')}">${stats.correct}/${stats.total} (${modPct}%)</p>
        `;
        modContainer.appendChild(div);
      });

      // Update grid colors for evaluation
      currentFilteredList.forEach((q, idx) => {
        const btn = document.getElementById(`grid-btn-${idx}`);
        if (!btn) return;
        const isCorrect = userAnswers[q.id] === q.answer;
        btn.classList.remove("answered", "current");
        btn.classList.add(isCorrect ? "correct-eval" : "wrong-eval");
      });

      renderReview("all");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderReview(filter) {
      const container = document.getElementById("review-list");
      container.innerHTML = "";

      examQuestions.forEach((q, index) => {
        const userChoice = userAnswers[q.id] || "None (Unanswered)";
        const isCorrect = userChoice === q.answer;

        if (filter === "incorrect" && isCorrect) return;

        const item = document.createElement("div");
        item.className = `review-item ${isCorrect ? 'is-correct' : 'is-wrong'}`;

        item.innerHTML = `
          <div class="review-header">
            <div>
              <strong>#${index + 1} ${q.id}</strong> — <span style="color:var(--text-secondary);">${q.topic}</span>
            </div>
            <div class="review-status" style="color: ${isCorrect ? 'var(--success)' : 'var(--danger)'}">
              ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
            </div>
          </div>

          <div style="font-weight: 500; margin: 8px 0;">${q.question}</div>

          <div style="font-size:0.9rem; margin-bottom:8px;">
            <div><strong>Your Answer:</strong> <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userChoice}. ${q.options[userChoice] || 'No answer selected'}</span></div>
            <div><strong>Correct Answer:</strong> <span style="color:var(--success)">${q.answer}. ${q.options[q.answer]}</span></div>
          </div>

          <div class="explanation-box">
            <p><span class="exp-title">Why (Curriculum Rule):</span> ${q.why}</p>
            <p><span class="exp-title">Exam Trap:</span> ${q.trap}</p>
            <p><span class="exp-title">Core Theory:</span> ${q.theory}</p>
            ${q.note ? `<p style="color:#b06000;"><span class="exp-title">⚠️ Ground Truth Note:</span> ${q.note}</p>` : ''}
          </div>
        `;

        container.appendChild(item);
      });
    }

    function filterReview(mode) {
      renderReview(mode);
    }

    function restartExam() {
      if (confirm("Reset all responses and retake the test from question 1?")) {
        userAnswers = {};
        flaggedQuestions.clear();
        document.getElementById("results-card").style.display = "none";
        document.getElementById("quiz-card").style.display = "block";
        filterByModule();
        updateStats();
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
